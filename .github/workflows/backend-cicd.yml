# CI/CD de producción: solo backend FastAPI + modelo YOLO.
# Flutter (mobile/) no entra en este workflow.
#
# Secrets de GitHub (Settings → Secrets and variables → Actions):
#   GCP_PROJECT_ID          proyecto de Google Cloud
#   GCP_SA_KEY              JSON de una cuenta de servicio
#   DATABASE_URL            Postgres de producción (Cloud SQL)
# Variables (Settings → Variables), opcionales:
#   GCP_REGION              por defecto us-central1
#   CLOUDSQL_INSTANCE       proyecto:region:instancia, si usas Cloud SQL
#
# La cuenta de servicio necesita:
#   Artifact Registry Writer, Cloud Run Admin, Service Account User
#   y Cloud SQL Client si CLOUDSQL_INSTANCE está definida.
#
# El archivo ml/weights/visionai_yolo8n.pt tiene que estar en el repo:
# la imagen de producción lo copia dentro del contenedor.

name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "ml/visionai/**"
      - "ml/weights/visionai_yolo8n.pt"
      - "ml/requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-cicd.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ml/visionai/**"
      - "ml/weights/visionai_yolo8n.pt"
      - "ml/requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-cicd.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: visionai-api
  REPOSITORY: visionai

jobs:
  check:
    name: Validar backend y modelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: El modelo de producción está en el repo
        run: test -f ml/weights/visionai_yolo8n.pt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compilar backend y paquete YOLO
        run: python -m compileall -q backend ml/visionai

  image:
    name: Construir imagen
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Nombre de la imagen
        id: meta
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          else
            IMAGE="visionai-api:${GITHUB_SHA}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decidir despliegue
        id: deploy
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          enabled=false
          if [ "$EVENT_NAME" != "pull_request" ] && { [ "$REF_NAME" = "refs/heads/master" ] || [ "$REF_NAME" = "refs/heads/main" ]; }; then
            if [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ] && [ -n "$DATABASE_URL" ]; then
              enabled=true
            else
              echo "::warning::No se desplegó. Crea los secrets GCP_SA_KEY, GCP_PROJECT_ID y DATABASE_URL en el repositorio."
            fi
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en Google Cloud
        if: steps.deploy.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Instalar gcloud
        if: steps.deploy.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Publicar y desplegar en Cloud Run
        if: steps.deploy.outputs.enabled == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_PROJECT_ID}" ] || [ -z "${DATABASE_URL}" ]; then
            echo "Faltan secrets GCP_PROJECT_ID o DATABASE_URL."
            exit 1
          fi

          gcloud config set project "${GCP_PROJECT_ID}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          if ! gcloud artifacts repositories describe "${REPOSITORY}" --location="${REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${REPOSITORY}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="VisionAI API"
          fi

          docker push "${IMAGE}"

          ARGS=(
            --image "${IMAGE}"
            --region "${REGION}"
            --platform managed
            --allow-unauthenticated
            --port 8080
            --memory 2Gi
            --cpu 2
            --timeout 300
            --min-instances 0
            --max-instances 2
            --set-env-vars "^|^DATABASE_URL=${DATABASE_URL}|VISIONAI_CONFIDENCE=0.35"
          )
          if [ -n "${CLOUDSQL_INSTANCE}" ]; then
            ARGS+=(--add-cloudsql-instances "${CLOUDSQL_INSTANCE}")
          fi

          gcloud run deploy "${SERVICE}" "${ARGS[@]}"

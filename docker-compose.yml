services:
  api:
    build: .
    ports:
      - "8001:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://visionai:visionai@db:5432/visionai
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visionai
      POSTGRES_PASSWORD: visionai
      POSTGRES_DB: visionai
    ports:
      - "5433:5432"
    volumes:
      - visionai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionai -d visionai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visionai_pg:
